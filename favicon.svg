<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#006eae" flood-opacity="0.15" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Tarjeta base blanca idéntica a la estética del navbar de Hoop Perú -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" filter="url(#shadow)" />

  <!-- Logo oficial Hoop Perú embebido pixel-perfect idéntico a la plataforma -->
  <image href="data:image/webp;base64," x="32" y="160" width="448" height="192" preserveAspectRatio="xMidYMid meet" />
</svg>
