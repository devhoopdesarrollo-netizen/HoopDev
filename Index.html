<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoopPeru - Iniciar Sesión / Registro</title>
    <!-- Estilos Corporativos HoopPeru -->
    <link rel="stylesheet" href="resources/hoop-theme.css">
    <!-- Script de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hoop: {
                            blue: {
                                900: '#1d3854',
                                700: '#006eae',
                                500: '#299ad3',
                                300: '#80c8e4',
                                100: '#b8e1f1'
                            },
                            teal: {
                                900: '#146460',
                                600: '#00aea5',
                                400: '#57ddcd',
                                200: '#b5f4eb',
                                50:  '#dbf5f0'
                            },
                            magenta: {
                                900: '#751c5a',
                                700: '#9f1074',
                                500: '#af3a91',
                                300: '#d392c6',
                                100: '#e6cbe1'
                            }
                        },
                        // Mapeo corporativo para clases existentes de Tailwind
                        blue: {
                            50: '#eaf5fb',
                            100: '#b8e1f1',
                            300: '#80c8e4',
                            500: '#299ad3',
                            600: '#006eae',
                            700: '#1d3854',
                            900: '#1d3854'
                        },
                        green: {
                            50: '#dbf5f0',
                            100: '#cbf6ef',
                            200: '#b5f4eb',
                            400: '#57ddcd',
                            600: '#00aea5',
                            700: '#146460',
                            900: '#146460'
                        }
                    }
                }
            }
        };
    </script>
    <!-- Phosphor Icons CDN -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-md p-6 bg-white rounded-2xl shadow-xl border border-gray-100">
        <section class="flex flex-col items-center justify-center space-y-6">

            <!-- Logo -->
            <div class="flex items-center justify-center">
                <img src="resources/navbar-logo.webp" alt="HoopPeru Logo" class="w-[200px] object-contain">
            </div>

            <!-- Botones de Pestañas (Tab Switcher) -->
            <div class="flex w-full bg-gray-100 p-1 rounded-xl">
                <button type="button" id="tab-login"
                    class="w-1/2 py-2 text-sm font-semibold rounded-lg bg-white text-blue-600 shadow-sm transition cursor-pointer">
                    Iniciar Sesión
                </button>
                <button type="button" id="tab-register"
                    class="w-1/2 py-2 text-sm font-semibold rounded-lg text-gray-600 hover:text-gray-900 transition cursor-pointer">
                    Registrarse
                </button>
            </div>

            <!-- Formulario de Inicio de Sesión -->
            <div class="w-full" id="login-container">
                <form id="formLogin" class="flex flex-col space-y-4">
                    <!-- Contenedor de Alerta de Error de Login (Sin alert) -->
                    <div id="login-alert" class="hidden p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs flex items-center space-x-2 transition-all">
                        <i class="ph ph-warning-circle text-lg text-red-600 shrink-0"></i>
                        <span id="login-alert-text"></span>
                    </div>

                    <div class="flex flex-col space-y-1">
                        <label for="login-user" class="text-sm font-medium text-gray-700 flex items-center gap-1.5">
                            <i class="ph ph-envelope text-base text-blue-600"></i> Correo electrónico
                        </label>
                        <input type="email" name="login-user" id="login-user" required placeholder="tu.correo@ejemplo.com"
                            class="px-3.5 py-2.5 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm text-gray-800 transition-all">
                    </div>

                    <div class="flex flex-col space-y-1">
                        <label for="login-pass" class="text-sm font-medium text-gray-700 flex items-center gap-1.5">
                            <i class="ph ph-lock-key text-base text-blue-600"></i> Clave de acceso
                        </label>
                        <input type="password" name="login-pass" id="login-pass" required placeholder="Ingresa tu clave"
                            class="px-3.5 py-2.5 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm text-gray-800 transition-all">
                    </div>

                    <button type="submit"
                        class="w-full py-2.5 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition duration-200 cursor-pointer flex items-center justify-center space-x-2 shadow-sm">
                        <span>Iniciar sesión</span>
                    </button>
                </form>
            </div>

            <!-- Formulario de Registro -->
            <div class="w-full hidden" id="register-container">
                <form id="registroNewUser" class="flex flex-col space-y-3">
                    <!-- Contenedor de Alerta de Registro (Sin alert) -->
                    <div id="register-alert" class="hidden p-3 rounded-xl text-xs flex items-center space-x-2 transition-all">
                        <i class="alert-icon text-lg shrink-0"></i>
                        <span id="register-alert-text"></span>
                    </div>
                    
                    <div class="flex flex-col space-y-1">
                        <label for="reg-name" class="text-sm font-medium text-gray-700">Nombre completo</label>
                        <input type="text" id="reg-name" name="reg-name" required placeholder="Tu nombre y apellido"
                            class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div class="flex flex-col space-y-1">
                        <label for="reg-email" class="text-sm font-medium text-gray-700">Correo electrónico</label>
                        <input type="email" id="reg-email" name="reg-correo" required placeholder="correo@ejemplo.com"
                            class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div class="flex flex-col space-y-1">
                        <label for="reg-Password" class="text-sm font-medium text-gray-700">Contraseña</label>
                        <input type="password" id="reg-Password" name="reg-Password" required placeholder="••••••••"
                            class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div class="flex flex-col space-y-1">
                        <label for="reg-date" class="text-sm font-medium text-gray-700">Fecha de nacimiento</label>
                        <input type="date" id="reg-date" name="reg-date"
                            class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div class="flex flex-col space-y-1">
                        <label for="reg-spec" class="text-sm font-medium text-gray-700">Especialización / Área de Interés</label>
                        <input type="text" id="reg-spec" name="reg-spec" placeholder="Ej: Estudiante, Docente, Robótica, Idiomas"
                            class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div class="flex flex-col space-y-1">
                        <label for="reg-country" class="text-sm font-medium text-gray-700">País</label>
                        <select id="reg-country" name="reg-country" required
                            class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white cursor-pointer">
                            <option value="Perú" selected>Perú</option>
                            <option value="Argentina">Argentina</option>
                            <option value="Bolivia">Bolivia</option>
                            <option value="Brasil">Brasil</option>
                            <option value="Chile">Chile</option>
                            <option value="Colombia">Colombia</option>
                            <option value="Costa Rica">Costa Rica</option>
                            <option value="Ecuador">Ecuador</option>
                            <option value="El Salvador">El Salvador</option>
                            <option value="España">España</option>
                            <option value="Estados Unidos">Estados Unidos</option>
                            <option value="Guatemala">Guatemala</option>
                            <option value="Honduras">Honduras</option>
                            <option value="México">México</option>
                            <option value="Nicaragua">Nicaragua</option>
                            <option value="Panamá">Panamá</option>
                            <option value="Paraguay">Paraguay</option>
                            <option value="República Dominicana">República Dominicana</option>
                            <option value="Uruguay">Uruguay</option>
                            <option value="Venezuela">Venezuela</option>
                            <option value="Otro">Otro país</option>
                        </select>
                    </div>

                    <button type="submit"
                        class="w-full py-2.5 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 transition duration-200 cursor-pointer shadow-sm">
                        Completar Registro
                    </button>
                </form>
            </div>

        </section>
    </main>

    <!-- Script de alternancia de pestañas -->
    <script>
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const loginContainer = document.getElementById('login-container');
        const registerContainer = document.getElementById('register-container');

        tabLogin.addEventListener('click', () => {
            loginContainer.classList.remove('hidden');
            registerContainer.classList.add('hidden');
            tabLogin.classList.add('bg-white', 'text-blue-600', 'shadow-sm');
            tabLogin.classList.remove('text-gray-600');
            tabRegister.classList.remove('bg-white', 'text-blue-600', 'shadow-sm');
            tabRegister.classList.add('text-gray-600');
        });

        tabRegister.addEventListener('click', () => {
            registerContainer.classList.remove('hidden');
            loginContainer.classList.add('hidden');
            tabRegister.classList.add('bg-white', 'text-blue-600', 'shadow-sm');
            tabRegister.classList.remove('text-gray-600');
            tabLogin.classList.remove('bg-white', 'text-blue-600', 'shadow-sm');
            tabLogin.classList.add('text-gray-600');
        });
    </script>

    <!-- Script de la aplicación empaquetada -->
    <script src="dist/bundle.js"></script>
</body>
</html>
