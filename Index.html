<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoopPeru - Iniciar Sesión / Registro</title>
    <!-- Script de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-md p-6 bg-white rounded-2xl shadow-xl border border-gray-100">
        <section class="flex flex-col items-center justify-center space-y-6">

            <!-- Logo -->
            <div class="flex items-center justify-center">
                <img src="resources/navbar-logo.webp" alt="HoopPeru Logo" class="w-[200px] object-contain">
            </div>

            <!-- Botones de Pestañas (Tab Switcher) -->
            <div class="flex w-full bg-gray-100 p-1 rounded-xl">
                <button type="button" id="tab-login"
                    class="w-1/2 py-2 text-sm font-semibold rounded-lg bg-white text-blue-600 shadow-sm transition">
                    Iniciar Sesión
                </button>
                <button type="button" id="tab-register"
                    class="w-1/2 py-2 text-sm font-semibold rounded-lg text-gray-600 hover:text-gray-900 transition">
                    Registrarse
                </button>
            </div>

            <!-- Formulario de Inicio de Sesión -->
            <div class="w-full" id="login-container">
                <form id="formLogin" class="flex flex-col space-y-4">
                    <div class="flex flex-col space-y-1">
                        <label for="login-user"  class="text-sm font-medium text-gray-700">Usuario / Correo</label>
                        <input type="text" name="login-user" id="login-user" placeholder="ejemplo@correo.com"
                            class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                       </div>

                    <div class="flex flex-col space-y-1">
                        <label for="login-pass"  class="text-sm font-medium text-gray-700">Contraseña</label>
                        <input type="password" name="login-pass" id="login-pass" placeholder="••••••••"
                            class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <button type="submit"
                        class="w-full py-2.5 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition duration-200">
                        Iniciar sesión
                    </button>
                </form>
            </div>

            <!-- Formulario de Registro -->
            <div class="w-full hidden" id="register-container">
                <form id="registroNewUser" class="flex flex-col space-y-3">
                    
                    <div class="flex flex-col space-y-1">
                        <label for="reg-name" class="text-sm font-medium text-gray-700">Nombre completo</label>
                        <input type="text" id="reg-name" name="reg-name" required placeholder="Tu nombre"
                            class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div class="flex flex-col space-y-1">
                        <label for="reg-email" class="text-sm font-medium text-gray-700">Correo electrónico</label>
                        <input type="email" id="reg-email" name="reg-correo" required placeholder="correo@ejemplo.com"
                            class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div class="flex flex-col space-y-1">
                        <label for="reg-Password" class="text-sm font-medium text-gray-700">Contraseña</label>
                        <input type="password" id="reg-Password" name="reg-Password" required placeholder="••••••••"
                            class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div class="flex flex-col space-y-1">
                        <label for="reg-date" class="text-sm font-medium text-gray-700">Fecha de nacimiento</label>
                        <input type="date" id="reg-date" name="reg-date"
                            class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div class="flex flex-col space-y-1">
                        <label for="reg-spec" class="text-sm font-medium text-gray-700">Especialización / Posición</label>
                        <input type="text" id="reg-spec" name="reg-spec" placeholder="Ej: Base, Alero, Pivot, Entrenador"
                            class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div class="flex flex-col space-y-1">
                        <label for="reg-country" class="text-sm font-medium text-gray-700">País</label>
                        <select id="reg-country" name="reg-country"
                            class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                            <option value="Perú">Perú</option>
                            <option value="Argentina">Argentina</option>
                            <option value="Chile">Chile</option>
                            <option value="Colombia">Colombia</option>
                            <option value="México">México</option>
                            <option value="España">España</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>

                    <button type="submit"
                        class="w-full py-2.5 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 transition duration-200">
                        Completar Registro
                    </button>
                </form>
            </div>

        </section>
    </main>

    <!-- Script de alternancia de pestañas -->
    <script>
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const loginContainer = document.getElementById('login-container');
        const registerContainer = document.getElementById('register-container');

        tabLogin.addEventListener('click', () => {
            loginContainer.classList.remove('hidden');
            registerContainer.classList.add('hidden');
            tabLogin.classList.add('bg-white', 'text-blue-600', 'shadow-sm');
            tabLogin.classList.remove('text-gray-600');
            tabRegister.classList.remove('bg-white', 'text-blue-600', 'shadow-sm');
            tabRegister.classList.add('text-gray-600');
        });

        tabRegister.addEventListener('click', () => {
            registerContainer.classList.remove('hidden');
            loginContainer.classList.add('hidden');
            tabRegister.classList.add('bg-white', 'text-blue-600', 'shadow-sm');
            tabRegister.classList.remove('text-gray-600');
            tabLogin.classList.remove('bg-white', 'text-blue-600', 'shadow-sm');
            tabLogin.classList.add('text-gray-600');
        });
    </script>

    <!-- Script de la aplicación empaquetada -->
    <script src="dist/bundle.js"></script>
</body>
</html>
