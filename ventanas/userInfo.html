<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Red Social</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Phosphor Icons CDN -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Header Superior -->
    <header
        class="bg-white border-b border-gray-200 px-4 sm:px-6 py-4 flex justify-between items-center shadow-sm sticky top-0 z-50">
        <div class="flex items-center">
            <img src="resources/navbar-logo.webp" alt="Logo" class="h-8 w-auto">
        </div>
        <div class="flex items-center space-x-3">
            <span class="text-sm font-medium text-gray-700 hidden sm:inline">Mi Usuario</span>
            <div
                class="h-10 w-10 rounded-full bg-gray-200 overflow-hidden border border-gray-300 flex items-center justify-center shrink-0">
                <span class="text-xs text-gray-500 font-semibold">U</span>
            </div>
        </div>
    </header>

    <!-- Menú de Navegación Móvil (Visible solo en pantallas pequeñas) -->
    

    <!-- Layout Principal Centrado y Responsivo -->
    <main class="max-w-7xl mx-auto px-4 py-6 sm:py-8 w-full flex-grow flex justify-center items-start">

        <!-- Tarjeta de Usuario Centrada -->
        <section class="w-full sm:w-96 md:w-80 bg-white border border-gray-200 rounded-2xl p-6 shadow-sm flex flex-col items-center text-center space-y-4">
            
            <!-- Contenedor de la Foto de Usuario -->
            <div class="relative">
                <div class="h-24 w-24 rounded-full bg-gray-100 border-2 border-blue-100 overflow-hidden flex items-center justify-center shadow-inner">
                    <i class="ph ph-user text-4xl text-gray-400"></i>
                </div>
                <span class="absolute bottom-1 right-1 h-5 w-5 bg-green-500 border-2 border-white rounded-full" title="Activo"></span>
            </div>

            <!-- Información Detallada -->
            <article class="w-full text-left space-y-3">
                <h2 class="text-base font-bold text-gray-900 border-b border-gray-100 pb-2 text-center">Información del Usuario</h2>
                
                <div class="space-y-2 text-sm">
                    <p class="flex justify-between text-gray-600"><span class="font-medium text-gray-500">Nombre:</span> <span class="font-semibold text-gray-800">John Doe</span></p>
                    <p class="flex justify-between text-gray-600"><span class="font-medium text-gray-500">Correo:</span> <span class="font-semibold text-gray-800 text-xs truncate max-w-[150px]">john.doe@example.com</span></p>
                    <p class="flex justify-between text-gray-600"><span class="font-medium text-gray-500">Estatus:</span> <span class="px-2 py-0.5 text-xs font-semibold bg-green-50 text-green-700 rounded-full">ACTIVO</span></p>
                    <p class="flex justify-between text-gray-600"><span class="font-medium text-gray-500">Programa:</span> <span class="font-semibold text-gray-800">Robótica</span></p>
                    <p class="flex justify-between text-gray-600"><span class="font-medium text-gray-500">Cargo:</span> <span class="font-semibold text-gray-800">Voluntario</span></p>
                    <p class="flex justify-between text-gray-600"><span class="font-medium text-gray-500">País:</span> <span class="font-semibold text-gray-800">México</span></p>
                </div>
            </article>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-4 text-center mt-auto">
        <div>
            <p class="text-sm text-gray-500">&copy; 2026 Mi Sitio Web. Todos los derechos reservados.</p>
        </div>
    </footer>

</body>

</html>
